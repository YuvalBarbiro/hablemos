<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>¡Hablemos!</title>
  <meta name="description" content="Learn Spanish from scratch, in English.">
  <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hablemos">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" class="view"></main>
  <nav id="tabbar" class="tabbar"></nav>
  <noscript>This app needs JavaScript.</noscript>
  <script>window.APP_VERSION = '1.0.0';</script>
  <script src="js/data/units1-2.js"></script>
  <script src="js/data/units3-4.js"></script>
  <script src="js/data/units5-6.js"></script>
  <script src="js/data/reference.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const w = reg.installing;
          w && w.addEventListener('statechange', () => {
            if (w.state === 'installed' && navigator.serviceWorker.controller) {
              const b = document.createElement('button');
              b.className = 'update-banner'; b.textContent = 'New version ready. Tap to update.';
              b.onclick = () => location.reload();
              document.body.appendChild(b);
            }
          });
        });
      }).catch(() => {});
    }
  </script>
</body>
</html>
